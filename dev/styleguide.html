<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<base href="/VCT-board/">
<title>컴포넌트 견본 (개발용)</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* 견본 바깥 틀만 쓴다. 견본 내용은 실제 CSS(css/style.css)와 실제 렌더 함수로 그린다. */
  body.sg-shell { margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; background: #E9E9E4; color: #16181D; }
  .sg-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
  .sg-bar label { display: flex; gap: 6px; align-items: center; }
  .sg-frame { border: 1px solid #999; background: #F7F6F2; height: calc(100vh - 80px); }
  .sg-note { margin: 8px 0 0; color: #575D66; }
  /* 견본 칸 모양(토큰 미리보기용). 값은 모두 토큰이다. */
  .sg-sec { margin: 0 0 var(--space-2xl); }
  .sg-h { margin: 0 0 var(--space-s); font-size: var(--text-body); color: var(--color-mute); letter-spacing: .04em; }
  .sg-sub { margin: var(--space-m) 0 var(--space-xs); font-size: var(--text-meta); color: var(--color-mute); }
  .sg-tokens { width: 100%; border-collapse: collapse; font-size: var(--text-small); }
  .sg-tokens th, .sg-tokens td { text-align: left; padding: var(--space-xs) var(--space-s); border-bottom: 1px solid var(--color-line); vertical-align: middle; }
  .sg-tokens th { font-weight: 400; color: var(--color-mute); }
  .sg-sw { display: inline-block; width: var(--space-xl); height: var(--space-l); border: 1px solid var(--color-line-strong); border-radius: var(--radius-s); }
  .sg-bar-sp { display: inline-block; height: var(--space-xs); background: var(--color-accent); border-radius: var(--radius-pill); }
  .sg-radius { display: inline-block; width: var(--space-xl); height: var(--space-xl); border: 1px solid var(--color-line-strong); background: var(--surface); }
  .sg-ctl { display: inline-flex; align-items: center; min-width: var(--space-3xl); justify-content: center; border: 1px dashed var(--color-line-strong); border-radius: var(--radius-s); }
</style>
</head>
<body class="sg-shell">
<script type="module">
  // 견본 안쪽(frame=1)은 실제 렌더 함수로 그린다. 바깥 틀은 아래 스크립트만 쓴다.
  if (new URLSearchParams(location.search).has("frame")) await import("./dev/styleguide.js"); // <base> 기준이라 dev/ 를 붙인다
</script>
<div id="outer">
  <div class="sg-bar">
    <label>언어 <select id="sg-lang"><option value="ko">한국어</option><option value="en">English</option></select></label>
    <label>색 <select id="sg-mode"><option value="light">라이트</option><option value="dark">다크</option></select></label>
    <label>폭 <select id="sg-width"><option value="360">360</option><option value="375" selected>375</option><option value="768">768</option><option value="1280">1280</option></select></label>
  </div>
  <iframe id="sg-frame" class="sg-frame" title="컴포넌트 견본" style="width: 375px; max-width: 100%;"></iframe>
  <p class="sg-note">개발용 화면. 배포하지 않는다(build.mjs 가 dev/ 를 복사하지 않는다). 폭 미리보기는 iframe 폭을 바꿔 실제 미디어 조건으로 그린다.</p>
</div>
<script>
  // 바깥 틀: 언어·색·폭을 골라 iframe 주소를 바꾼다.
  (function () {
    if (new URLSearchParams(location.search).has("frame")) return; // 견본 안쪽에서는 바깥 틀을 돌리지 않는다(중첩 방지)
    var lang = document.getElementById("sg-lang"), mode = document.getElementById("sg-mode"), width = document.getElementById("sg-width"), frame = document.getElementById("sg-frame");
    function go() {
      frame.src = "dev/styleguide.html?frame=1&lang=" + lang.value + "&mode=" + mode.value;
      frame.style.width = width.value + "px";
    }
    lang.addEventListener("change", go); mode.addEventListener("change", go); width.addEventListener("change", go);
    var q = new URLSearchParams(location.search);
    if (q.has("lang")) lang.value = q.get("lang");
    if (q.has("mode")) mode.value = q.get("mode");
    if (q.has("width")) width.value = q.get("width");
    go();
  })();
</script>
</body>
</html>
