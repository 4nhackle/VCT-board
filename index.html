  function toItem(r, kind) {
    if (kind === "player") return { region: r[0], team: r[1], name: r[2], sub: [r[3], r[4]].filter(Boolean).join(", "), status: r[5], date: r[6], conf: r[7], note: r[8], src: S[r[9]] };
    if (kind === "coach") return { region: r[0], team: r[1], name: r[2], sub: r[3], status: r[4], date: r[5], conf: r[6], note: r[7], src: S[r[8]] };
    if (kind === "watch") return { region: r[0], team: r[1], name: r[2], note: r[3], src: S[r[4]] };
    return { region: r[0], team: r[2], name: r[1], sub: "", status: r[4], next: r[3], moved: true, date: r[5], conf: r[6], note: r[7], src: S[r[8]] };
  }
  var P = PLAYERS.map(function (r) { return toItem(r, "player"); });
  var CO = COACHES.map(function (r) { return toItem(r, "coach"); });
  var W = WATCH.map(function (r) { return toItem(r, "watch"); });
  var T1 = TRANSFERS.map(function (r) { return toItem(r, "t"); });
  var T2 = TRANSFERS_COACH.map(function (r) { return toItem(r, "t"); });

  var TABS = [
    { id: "players", label: "선수", mode: "entry", status: true, size: P.length, groups: [{ items: P }] },
    { id: "coaches", label: "코치·스태프", mode: "entry", status: true, size: CO.length, groups: [{ items: CO }] },
    { id: "transfers", label: "이적 완료", mode: "entry", size: T1.length + T2.length, hint: "이전 소속 팀 기준으로 묶었습니다.", groups: [{ title: "선수", items: T1 }, { title: "코치·스태프", items: T2 }] },
    { id: "watch", label: "지켜볼 팀", mode: "watch", size: W.length, hint: "계약 만료나 존속 여부가 정해지지 않은 팀입니다.", groups: [{ items: W }] },
    { id: "schedule", label: "일정", mode: "schedule", size: SCHEDULE.length },
    { id: "suggest", label: "건의", mode: "suggest" }
  ];
  var STATUS_LABELS = [["all", "전체"], ["open", "구직 중"], ["signed", "새 팀 합류"], ["left", "팀 떠남"]];

  var state = { tab: "players", region: "all", status: "all", q: "" };
  try {
    var h = (location.hash || "").replace("#", "");
    if (TABS.some(function (t) { return t.id === h; })) state.tab = h;
  } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtDate(n) {
    if (typeof n !== "number") return esc(n);
    var d = new Date(Date.UTC(1899, 11, 30) + n * 864e5);
    return (d.getUTCMonth() + 1) + "/" + d.getUTCDate();
  }
  function tabById(id) { return TABS.filter(function (t) { return t.id === id; })[0]; }

  // 상태를 세 가지 말로 줄인다: 구직 중, 새 팀 합류, 팀 떠남.
  function pillOf(it) {
    if (it.moved) return ["signed", /잔류/.test(it.status) ? "잔류" : it.next + " 합류"];
    var s = it.status;
    if (/계약 완료/.test(s)) {
      var m = s.match(/\((.+)\)/);
      return ["signed", m ? (/잔류/.test(m[1]) ? m[1] : m[1] + " 합류") : "새 팀 합류"];
    }
    if (/방출/.test(s)) return ["left", "방출"];
    if (/이탈|결별/.test(s)) return ["left", "팀 떠남"];
    return ["open", "구직 중"];
  }
  function cls(it) { return pillOf(it)[0]; }

  function srcHTML(s) {
    return s ? '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener">출처: ' + esc(s[0]) + "</a>" : "";
  }

  function rowHTML(it, tab) {
    if (tab.mode === "watch") {
      return '<li class="row"><div class="main"><span class="name">' + esc(it.team) + '</span></div><p class="detail">대상: ' + esc(it.name) + ". " + esc(it.note) + srcHTML(it.src) + "</p></li>";
    }
    var p = pillOf(it);
    var prefix = "";
    if (it.sub) prefix += esc(it.sub) + ". ";
    if (!it.moved && !/^(팀 이탈|계약 완료|방출|이탈 보도)/.test(it.status)) prefix += esc(it.status) + ". ";
    return '<li class="row"><div class="main"><span class="name">' + esc(it.name) + '</span><span class="team">' + esc(it.team) + "</span></div>" +
      '<div class="state"><span class="pill ' + p[0] + '">' + esc(p[1]) + "</span>" +
      (it.conf === "R" ? '<span class="tag">단일 출처</span>' : "") +
      '<span class="date">' + fmtDate(it.date) + " 보도</span></div>" +
      '<p class="detail">' + prefix + esc(it.note) + srcHTML(it.src) + "</p></li>";
  }

  function matches(it, tab) {
    if (state.region !== "all" && it.region !== state.region) return false;
    if (tab.status && state.status !== "all" && cls(it) !== state.status) return false;
    if (state.q) {
      var hay = [it.name, it.team, it.sub, it.status, it.next, it.note, it.region, REGION_KO[it.region]].join(" ").toLowerCase();
      if (hay.indexOf(state.q.toLowerCase()) < 0) return false;
    }
    return true;
  }

  function regionsHTML(items, tab) {
    var out = "";
    REGIONS.forEach(function (reg) {
      var inReg = items.filter(function (it) { return it.region === reg; });
      if (!inReg.length) return;
      out += '<div class="rh"><h2>' + REGION_KO[reg] + '</h2><span class="en">' + reg + '</span><span class="n">' + inReg.length + "건</span></div>";
      out += '<ul class="list">' + inReg.map(function (it) { return rowHTML(it, tab); }).join("") + "</ul>";
    });
    return out;
  }

  function scheduleHTML() {
    return '<ul class="list">' + SCHEDULE.map(function (r) {
      return '<li class="row sch"><span class="when">' + fmtDate(r[0]) + '</span><p class="detail" style="color:var(--ink);font-size:15px">' + esc(r[1]) + " <span style=\"color:var(--mute);font-size:13px\">(" + esc(r[2]) + ")</span></p></li>";
    }).join("") + "</ul>";
  }

  var MAIL = "biggest-cannula9b@icloud.com";

  function suggestHTML() {
    return '<form class="sg" id="sg" autocomplete="off">' +
      '<p class="hint" style="max-width:56ch">잘못된 정보, 빠진 선수나 팀, 바라는 기능을 알려 주세요. 내용을 쓰고 메일 앱에서 보내면 전달됩니다.</p>' +
      '<label for="sgType">종류<select id="sgType"><option>정보 오류</option><option>빠진 선수·팀</option><option>기능 제안</option><option>기타</option></select></label>' +
      '<label for="sgText">내용<textarea id="sgText" maxlength="1500" placeholder="선수 이름, 팀, 바로잡을 내용을 적어 주세요."></textarea></label>' +
      '<label for="sgLink">근거 링크 (선택)<input id="sgLink" type="url" placeholder="https://"></label>' +
      '<div class="btns"><a class="btn" id="sgSend" href="#" aria-disabled="true">메일 앱으로 보내기</a><button type="button" class="btn alt" id="sgCopy">내용 복사</button></div>' +
      '<p class="hint" id="sgMsg" role="status"></p>' +
      '<p class="hint">메일 앱이 열리지 않으면 내용을 복사해 <span class="addr" id="sgAddr">' + MAIL + '</span> 로 보내 주세요. <button type="button" class="linkbtn" id="sgCopyAddr">주소 복사</button></p>' +
      "</form>";
  }

  function bindSuggest() {
    function composed() {
      var t = $("sgText").value.trim(), l = $("sgLink").value.trim();
      return {
        subject: "[VCT 현황 건의] " + $("sgType").value,
        body: t + (l ? "\n\n근거 링크: " + l : "") + "\n\n(VCT LFT·FA 현황 페이지에서 작성)"
      };
    }
    function sync() {
      var ok = $("sgText").value.trim().length > 0, a = $("sgSend");
      a.setAttribute("aria-disabled", ok ? "false" : "true");
      if (ok) {
        var c = composed();
        a.href = "mailto:" + MAIL + "?subject=" + encodeURIComponent(c.subject) + "&body=" + encodeURIComponent(c.body.replace(/\n/g, "\r\n"));
      } else {
        a.href = "#";
      }
    }
    function say(m) { $("sgMsg").textContent = m; }
    function copy(text, okMsg, fallbackEl) {
      var fail = function () {
        if (fallbackEl) {
          try {
            var r = document.createRange();
            r.selectNodeContents(fallbackEl);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(r);
          } catch (e) {}
        }
        say("자동 복사가 되지 않았습니다. 선택된 글자를 직접 복사해 주세요.");
      };
      try {
        navigator.clipboard.writeText(text).then(function () { say(okMsg); }, fail);
      } catch (e) { fail(); }
    }
    ["sgType", "sgText", "sgLink"].forEach(function (id) { $(id).addEventListener("input", sync); });
    $("sgSend").addEventListener("click", function (e) {
      if (this.getAttribute("aria-disabled") === "true") { e.preventDefault(); return; }
      say("메일 앱이 열리면 보내기를 눌러 주세요. 보내기를 눌러야 전달됩니다.");
    });
    $("sgCopy").addEventListener("click", function () {
      if (!$("sgText").value.trim()) { say("복사할 내용을 먼저 적어 주세요."); return; }
      var c = composed();
      copy(c.subject + "\n\n" + c.body, "내용을 복사했습니다. 메일에 붙여 넣어 보내 주세요.", $("sgText"));
    });
    $("sgCopyAddr").addEventListener("click", function () {
      copy(MAIL, "주소를 복사했습니다.", $("sgAddr"));
    });
    $("sg").addEventListener("submit", function (e) { e.preventDefault(); });
  }

  function renderView() {
    var tab = tabById(state.tab);
    var html = "";
    if (tab.mode === "suggest") {
      $("view").innerHTML = suggestHTML();
      bindSuggest();
      return;
    }
    if (tab.mode === "schedule") {
      html = scheduleHTML();
    } else {
      var total = 0;
      tab.groups.forEach(function (g) {
        var items = g.items.filter(function (it) { return matches(it, tab); });
        total += items.length;
        if (!items.length) return;
        if (g.title) html += '<h2 class="kind">' + g.title + "</h2>";
        html += regionsHTML(items, tab);
      });
      if (!total) html = '<div class="empty">조건에 맞는 항목이 없습니다. 지역이나 상태를 바꾸거나 검색어를 지워 보세요.</div>';
      if (tab.hint) html = '<p class="hint">' + tab.hint + "</p>" + html;
    }
    $("view").innerHTML = html;
  }

  function renderChrome() {
    var tab = tabById(state.tab);
    $("tabs").innerHTML = TABS.map(function (t) {
      return '<button type="button" class="tab" data-tab="' + t.id + '" aria-pressed="' + (state.tab === t.id) + '">' + t.label + (t.size != null ? '<span class="n">' + t.size + "</span>" : "") + "</button>";
    }).join("");

    var sched = tab.mode === "schedule";
    $("filters").hidden = sched || tab.mode === "suggest";
    $("summary").hidden = !tab.status;
    if (tab.status) {
      var base = tab.groups[0].items;
      $("summary").innerHTML = STATUS_LABELS.map(function (s) {
        var n = s[0] === "all" ? base.length : base.filter(function (it) { return cls(it) === s[0]; }).length;
        return '<button type="button" class="sum ' + s[0] + '" data-status="' + s[0] + '" aria-pressed="' + (state.status === s[0]) + '"><span class="v">' + n + '</span><span class="k">' + s[1] + "</span></button>";
      }).join("");
    }
    $("regions").innerHTML = ["all"].concat(REGIONS).map(function (r) {
      return '<button type="button" class="chip" data-region="' + r + '" aria-pressed="' + (state.region === r) + '">' + (r === "all" ? "모든 지역" : REGION_KO[r]) + "</button>";
    }).join("");
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.tab) state.tab = b.dataset.tab;
    else if (b.dataset.region) state.region = b.dataset.region;
    else if (b.dataset.status) state.status = b.dataset.status;
    else return;
    renderChrome();
    renderView();
  });
  $("q").addEventListener("input", function (e) {
    state.q = e.target.value.trim();
    renderView();
  });

  renderChrome();
  renderView();
})();
</script>
</body></html>
