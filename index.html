  function $(id) { return document.getElementById(id); }

  // 오늘(한국 시간)을 시트와 같은 날짜 일련번호로. 최근 사흘(오늘·어제·그제) 보도를 새 소식으로 본다.
  var TODAY = Math.floor((Date.now() + 9 * 36e5) / 864e5) + 25569;
  function isNew(it) { return typeof it.date === "number" && TODAY - it.date >= 0 && TODAY - it.date <= 2; }

  // 비고에 적힌 보도 시각("10/24 16:30 UTC" 또는 "... KST")을 한국 시간 기준 분 단위로. 없으면 null.
  function stampOf(it) {
    if (it._st !== undefined) return it._st;
    var m = /(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})\s*(UTC|KST)/.exec(it.note || ""), r = null;
    if (m && typeof it.date === "number") {
      var base = new Date(Date.UTC(1899, 11, 30) + it.date * 864e5).getUTCFullYear(), best = null;
      [base - 1, base, base + 1].forEach(function (yy) {

  function dayWord(n) {

  // 상태를 세 가지 말로 줄인다: 구직 중, 새 팀 합류, 팀 떠남.

  function rowHTML(it, tab, opt) {

    if (meta) prefix += '<span class="meta">' + esc(meta) + "</span>";
    if (!it.moved && !/^(팀 이탈|계약 완료|방출|이탈 보도)/.test(it.status)) prefix += esc(it.status) + ". ";

  function matches(it, tab) {

  function regionsHTML(items, tab) {

    // REGIONS 밖의 지역 값은 "기타"로 모아 보여준다.

      if (!inReg.length) return;

  // 최근 소식순: 보도 날짜별로 묶어 최신부터.
  function recentHTML(items, tab) {
    var days = [];
    items.forEach(function (it) { if (days.indexOf(it.date) < 0) days.push(it.date); });
    days.sort(function (a, b) { return (typeof b === "number" ? b : -1) - (typeof a === "number" ? a : -1); });
    var WD = ["일", "월", "화", "수", "목", "금", "토"];
    return days.map(function (n) {
      var inDay = items.filter(function (it) { return it.date === n; });
      // 같은 날 안에서는 보도 시각이 확인된 소식을 먼저, 최신 시각순으로. 시각을 모르는 소식은 그 아래에 지역·팀 순.
      inDay.sort(function (a, b) {

          if (sa === null) return 1;
          if (sb === null) return -1;

        }

      });

        var full = (d.getUTCMonth() + 1) + "월 " + d.getUTCDate() + "일 (" + WD[d.getUTCDay()] + ")";

  // 일정 칸의 날짜(일련번호나 "11/5–11/8", "2027-01-14 ~ 02-07" 같은 글)에서 시작일과 끝일을 뽑는다.
  function spanOf(v) {
    if (typeof v === "number") return [v, v];
    var re = /(?:(\d{4})-)?(\d{1,2})[\/-](\d{1,2})/g, m, y = null, out = [];
    var base = new Date(Date.UTC(1899, 11, 30) + TODAY * 864e5).getUTCFullYear();
    while ((m = re.exec(String(v)))) {
      if (m[1]) y = +m[1];
      var best = null;
      (y ? [y] : [base - 1, base, base + 1]).forEach(function (yy) {
        var s = Math.round((Date.UTC(yy, +m[2] - 1, +m[3]) - Date.UTC(1899, 11, 30)) / 864e5);
        if (best === null || Math.abs(s - TODAY) < Math.abs(best - TODAY)) best = s;
      });
      out.push(best);
    }
    if (!out.length) return null;
    return [Math.min.apply(null, out), Math.max.apply(null, out)];
  }

  var MAIL = "biggest-cannula9b@icloud.com";

  function bindSuggest() {
    function composed() {
      var t = $("sgText").value.trim(), l = $("sgLink").value.trim();

        subject: "[VCT 현황 건의] " + $("sgType").value,

      };
    }
    function sync() {
      var ok = $("sgText").value.trim().length > 0, a = $("sgSend");

      $("sgPost").setAttribute("aria-disabled", ok ? "false" : "true");

        var c = composed();

      } else {
        a.href = "#";
      }
    }
    function say(m) { $("sgMsg").textContent = m; }
    function copy(text, okMsg, fallbackEl) {
      var fail = function () {
        if (fallbackEl) {
          try {
            var r = document.createRange();
            r.selectNodeContents(fallbackEl);
            var sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(r);
          } catch (e) {}
        }

      };
      try {
        navigator.clipboard.writeText(text).then(function () { say(okMsg); }, fail);
      } catch (e) { fail(); }
    }
    ["sgType", "sgText", "sgLink"].forEach(function (id) { $(id).addEventListener("input", sync); });
    $("sgSend").addEventListener("click", function (e) {
      if (this.getAttribute("aria-disabled") === "true") { e.preventDefault(); return; }

      var c = composed();
      copy(c.subject + "\n\n" + c.body, "내용을 복사했습니다. 메일에 붙여 넣어 보내 주세요.", $("sgText"));

    $("sgCopyAddr").addEventListener("click", function () {

    });
    var W3F_KEY = "9b8a3816-da7d-4970-ae64-64daec095ffd";
    $("sg").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = $("sgPost");
      if (btn.getAttribute("aria-disabled") === "true" || btn.dataset.busy) return;
      var c = composed();
      var fail = "전송하지 못했습니다. 메일 앱으로 보내거나 내용을 복사해 보내 주세요.";

      say("");
      fetch("https://api.web3forms.com/submit", {
        method: "POST",
        signal: AbortSignal.timeout && AbortSignal.timeout(15000),
        headers: { "Content-Type": "application/json", "Accept": "application/json" },

      }).then(function (r) {
        return r.json().then(function (j) { return r.ok && j && j.success; });
      }).then(function (ok) {
        if (ok) {
          $("sgText").value = "";
          $("sgLink").value = "";
          sync();
          say("전달했습니다. 건의해 주셔서 감사합니다.");
        } else {
          say(fail);
        }
      }).catch(function () {
        say(fail);
      }).then(function () {
        delete btn.dataset.busy;
        btn.textContent = "보내기";
      });
    });
  }

  function renderView() {
    var tab = tabById(state.tab);
    var html = "";
    // 건의 폼은 한 번만 만들어 두고 숨기기만 한다. 탭을 나갔다 와도 쓰던 글이 남는다.

      if (!$("sg")) { $("sgview").innerHTML = suggestHTML(); bindSuggest(); }
      return;
    }
    if (tab.mode === "schedule") {
      html = scheduleHTML();
    } else {
      var total = 0, fresh = 0, recent = state.order === "recent" && tab.mode === "entry";
      tab.groups.forEach(function (g) {
        var items = g.items.filter(function (it) { return matches(it, tab); });
        total += items.length;
        fresh += items.filter(isNew).length;
        if (!items.length) return;
        if (g.title) html += '<h2 class="kind">' + g.title + "</h2>";
        html += recent ? recentHTML(items, tab) : regionsHTML(items, tab);
      });
      if (!total) html = '<div class="empty">조건에 맞는 항목이 없습니다. 지역이나 상태를 바꾸거나 검색어를 지워 보세요.</div>';
      else if (fresh && tab.mode === "entry" && !recent) {
        $("fresh").hidden = false;
        $("fresh").innerHTML = '<span>최근 사흘 새 소식 <b>' + fresh + '건</b></span><button type="button" class="linkbtn" data-order="recent">최근 소식순으로 보기</button>';
      }
      if (tab.hint) html = '<p class="hint">' + tab.hint + "</p>" + html;
    }
    if (tab.mode === "entry" && state.order === "recent" && total) html = '<p class="hint">날짜별로 최신부터 나열합니다. 같은 날에는 보도 시각이 확인된 소식이 먼저 나오고, 시각을 모르는 소식은 그 아래에 놓습니다.</p>' + html;
    $("view").innerHTML = html;
  }

  function renderChrome() {

      return '<button type="button" class="tab" data-tab="' + t.id + '" aria-pressed="' + (state.tab === t.id) + '">' + t.label + (t.size != null ? '<span class="n">' + t.size + "</span>" : "") + "</button>";
    }).join("");

    var sched = tab.mode === "schedule";
    $("filters").hidden = sched || tab.mode === "suggest";
    $("summary").hidden = !tab.status;
    if (tab.status) {
      var base = [].concat.apply([], tab.groups.map(function (g) { return g.items; }));
      $("summary").innerHTML = STATUS_LABELS.map(function (s) {
        var n = s[0] === "all" ? base.length : base.filter(function (it) { return cls(it) === s[0]; }).length;
        return '<button type="button" class="sum ' + s[0] + '" data-status="' + s[0] + '" aria-pressed="' + (state.status === s[0]) + '"><span class="v">' + n + '</span><span class="k">' + s[1] + "</span></button>";
      }).join("");
    }
    $("regions").innerHTML = ["all"].concat(REGIONS).map(function (r) {
      return '<button type="button" class="chip" data-region="' + r + '" aria-pressed="' + (state.region === r) + '">' + (r === "all" ? "모든 지역" : REGION_KO[r]) + "</button>";
    }).join("");
    $("order").hidden = tab.mode !== "entry";
    $("order").innerHTML = [["team", "팀별로"], ["recent", "최근 소식순"]].map(function (o) {
      return '<button type="button" class="chip" data-order="' + o[0] + '" aria-pressed="' + (state.order === o[0]) + '">' + o[1] + "</button>";
    }).join("");
    ["tabs", "regions"].forEach(function (id) {
      var box = $(id), cur = box.querySelector('[aria-pressed="true"]');
      if (cur && box.scrollWidth > box.clientWidth) box.scrollLeft = cur.offsetLeft - (box.clientWidth - cur.offsetWidth) / 2;
    });
    document.title = (state.tab === "players" ? "" : tab.label + " · ") + "VCT LFT·FA 현황";
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var tabChanged = false;
    if (b.dataset.tab) { tabChanged = b.dataset.tab !== state.tab; state.tab = b.dataset.tab; }
    else if (b.dataset.region) state.region = b.dataset.region;
    else if (b.dataset.status) state.status = b.dataset.status;
    else if (b.dataset.order) {
      state.order = b.dataset.order;
      try { localStorage.setItem("vct-order", state.order); } catch (e) {}
    }
    else return;
    renderChrome();
    renderView();
    if (tabChanged) pushTab();
  });

  // 탭을 바꾸면 주소 뒤의 #탭이름도 바꾼다. 그래야 탭 링크를 공유하고 뒤로 가기를 쓸 수 있다.
  function pushTab() {
    try {
      if (location.hash !== "#" + state.tab) history.pushState(null, "", "#" + state.tab);
    } catch (e) {
      try { location.hash = state.tab; } catch (e2) {}
    }
  }
  function fromHash() {
    var h = (location.hash || "").replace("#", "") || "players";
    if (h !== state.tab && tabById(h)) {
      state.tab = h;
      renderChrome();
      renderView();
    }
  }
  window.addEventListener("hashchange", fromHash);
  window.addEventListener("popstate", fromHash);
  $("q").addEventListener("input", function (e) {
    state.q = e.target.value.trim();
    renderView();
  });

  renderChrome();
  renderView();
})();
</script>
</body></html>
